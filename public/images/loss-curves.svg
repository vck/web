<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="Training and validation loss curves showing overfitting and the early stopping point">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#101014">LOSS CURVES: STOP WHERE VALIDATION BOTTOMS OUT</text>

  <!-- grid -->
  <g stroke="#e5e9f0" stroke-width="1">
    <line x1="70" y1="80" x2="780" y2="80"/>
    <line x1="70" y1="140" x2="780" y2="140"/>
    <line x1="70" y1="200" x2="780" y2="200"/>
    <line x1="70" y1="260" x2="780" y2="260"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="310" stroke="#101014" stroke-width="2"/>
  <line x1="70" y1="310" x2="780" y2="310" stroke="#101014" stroke-width="2"/>
  <text x="30" y="180" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#606fa0" transform="rotate(-90 30 180)" text-anchor="middle">loss</text>
  <text x="425" y="338" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#606fa0" text-anchor="middle">epochs</text>

  <!-- early stop line at x=470 -->
  <line x1="470" y1="40" x2="470" y2="310" stroke="#101014" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="470" y="64" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#101014" text-anchor="middle" style="background:#fff">EARLY STOP</text>

  <!-- train loss: keeps falling -->
  <path d="M70,270 C180,240 260,210 360,180 C470,150 600,120 780,100" fill="none" stroke="#2b3bff" stroke-width="3"/>
  <!-- val loss: falls then rises -->
  <path d="M70,280 C180,250 280,215 380,190 C430,178 460,176 500,182 C580,196 680,235 780,285" fill="none" stroke="#c2410c" stroke-width="3"/>
  <circle cx="470" cy="178" r="6" fill="#c2410c" stroke="#fff" stroke-width="2"/>

  <!-- overfit zone -->
  <text x="640" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">OVERFITTING</text>
  <text x="640" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#606fa0" text-anchor="middle">memorizing noise</text>

  <!-- legend -->
  <rect x="90" y="52" width="18" height="6" fill="#2b3bff"/>
  <text x="114" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#101014">train</text>
  <rect x="180" y="52" width="18" height="6" fill="#c2410c"/>
  <text x="204" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#101014">validation</text>
</svg>
